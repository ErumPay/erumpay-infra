apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: billing-key-service-secret
  namespace: pg
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: erumpay-dev-secret-store
    kind: ClusterSecretStore
  target:
    name: billing-key-service-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: erumpay/dev/all
        property: DB_USERNAME
    - secretKey: DB_PASSWORD
      remoteRef:
        key: erumpay/dev/all
        property: DB_PASSWORD
    - secretKey: AES_SECRET_KEY
      remoteRef:
        key: erumpay/dev/all
        property: AES_SECRET_KEY
