apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-auth-service-secret
  namespace: pg
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: erumpay-dev-secret-store
    kind: ClusterSecretStore
  target:
    name: pg-auth-service-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: erumpay/dev/all
        property: DB_USERNAME
    - secretKey: DB_PASSWORD
      remoteRef:
        key: erumpay/dev/all
        property: DB_PASSWORD
    - secretKey: JWT_SECRET
      remoteRef:
        key: erumpay/dev/all
        property: JWT_SECRET
    - secretKey: INTERNAL_API_KEY
      remoteRef:
        key: erumpay/dev/all
        property: PG_AUTH_INTERNAL_API_KEY
