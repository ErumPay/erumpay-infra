  payment-service:
    build:
      context: ../payment-service
      dockerfile: Dockerfile
    container_name: erumpay-payment-service
    restart: unless-stopped
    ports:
      - '8083:8083'
    environment:
      DB_URL: jdbc:mysql://mysql:3306/payment_db
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      QR_BASEURL: http://payment-service:8083
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_BASE_URL: http://auth-service:8081
      PG_BASE_URL: http://pg-payment-service:8093
      RECOMMEND_BASE_URL: http://recommendation-service:8084
      CARD_BASE_URL: http://card-service:8082
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      card-service:
        condition: service_started
      pg-payment-service:
        condition: service_started
      recommendation-service:
        condition: service_started
    networks:
      - erumpay-network

  pg-payment-service:
    build:
      context: ../pg-payment-service
      dockerfile: Dockerfile
    container_name: erumpay-pg-payment-service
    restart: unless-stopped
    ports:
      - '8093:8093'
    environment:
      DB_URL: jdbc:mysql://mysql:3306/pg_payment_db
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
      billing-key-service:
        condition: service_started
      card-simulator-service:
        condition: service_started
    networks:
      - erumpay-network

  recommendation-service:
    build:
      context: ../recommendation-service
      dockerfile: Dockerfile
    container_name: erumpay-recommendation-service
    restart: unless-stopped
    ports:
      - '8084:8084'
    env_file:
      - ../recommendation-service/.env
    environment:
      DB_URL: jdbc:mysql://mysql:3306/recommend_db
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CARD_SERVICE_BASE_URL: http://card-service:8082
    depends_on:
      mysql:
        condition: service_healthy
      card-service:
        condition: service_started
    networks:
      - erumpay-network

