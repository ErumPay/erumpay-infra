services:
  mysql:
    image: mysql:8.0
    container_name: ${MYSQL_CONTAINER_NAME}
    restart: unless-stopped

    ports:
      - '${MYSQL_PORT}:3306'

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: ${TZ}

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00

    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
      - ./mysql/conf.d:/etc/mysql/conf.d

    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - erumpay-network

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: erumpay-kafka
    restart: unless-stopped

    ports:
      - '9092:9092'

    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test: ['CMD-SHELL', 'kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - erumpay-network

  redis:
    image: redis:7.2-alpine
    container_name: erumpay-redis
    restart: unless-stopped

    ports:
      - '6379:6379'

    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - erumpay-network

  auth-service:
    build:
      context: ../auth-service
      dockerfile: Dockerfile
    container_name: erumpay-auth-service
    restart: unless-stopped
    ports:
      - '8081:8081'
    environment:
      DB_URL: 'jdbc:mysql://mysql:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul'
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis # ############################# [fe] 조보름 260606 2104 | 로컬 FE 테스트용 dev token API(/api/v1/auth/dev/**) 활성화
      SPRING_PROFILES_ACTIVE: dev # [fe] 조보름 260606 2115 | 로컬 SMS 인증 테스트용 Octomo API Key 주입
      OCTOMO_API_KEY: ${OCTOMO_API_KEY} # ############################

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: erumpay-auth-service-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256
      AES_SECRET_KEY: 0123456789abcdef0123456789abcdef
      PHONE_HASH_SALT: erumpay-auth-phone-hash-salt-local
      KAKAO_CLIENT_ID: 3338ab0088875b9e2ba0e4a620d33ae0
      KAKAO_CLIENT_SECRET: gr9qHQkDbF22h1h3uqYorum8j8R6fojM
      KAKAO_REDIRECT_URI: http://localhost:19000/auth/callback
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - erumpay-network

  billing-key-service:
    build:
      context: ../billing-key-service
      dockerfile: Dockerfile
    container_name: erumpay-billing-key-service
    restart: unless-stopped
    ports:
      - '8092:8092'
    environment:
      DB_URL: jdbc:mysql://mysql:3306/pg_billing_db
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CARD_SIMULATOR_BASE_URL: http://card-simulator-service:8095
    depends_on:
      mysql:
        condition: service_healthy
      card-simulator-service:
        condition: service_started
    networks:
      - erumpay-network

  card-service:
    build:
      context: ../card-service
      dockerfile: Dockerfile
    container_name: erumpay-card-service
    restart: unless-stopped
    ports:
      - '8082:8082'
    environment:
      DB_URL: jdbc:mysql://mysql:3306/card_db
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      AUTH_SERVICE_BASE_URL: http://auth-service:8081
      BILLING_KEY_SERVICE_BASE_URL: http://billing-key-service:8092
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CARD_BILLING_KEY_AES_KEY: 0123456789abcdef
    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_started
      billing-key-service:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - erumpay-network

  card-simulator-service:
    build:
      context: ../card-simulator-service
      dockerfile: Dockerfile
    container_name: erumpay-card-simulator-service
    restart: unless-stopped
    ports:
      - '8095:8095'
    environment:
      DB_URL: jdbc:mysql://mysql:3306/simulator_db
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - erumpay-network

