nameOverride: notification-service
fullnameOverride: notification-service
replicaCount: 2

image:
  repository: "<AWS_ACCOUNT_ID>.dkr.ecr.ap-northeast-2.amazonaws.com/notification-service"
  tag: latest

containerPort: 8085

service:
  port: 8085

env:
  DB_URL: jdbc:mysql://<RDS_ENDPOINT>:3306/notification_db
  KAFKA_BOOTSTRAP_SERVERS: kafka.middleware.svc.cluster.local:9092

secretEnv:
  DB_USERNAME: "<DB_USERNAME>"
  DB_PASSWORD: "<DB_PASSWORD>"

nodeSelector:
  role: pay
