nameOverride: pg-auth-service
fullnameOverride: pg-auth-service
replicaCount: 2

image:
  repository: "<AWS_ACCOUNT_ID>.dkr.ecr.ap-northeast-2.amazonaws.com/pg-auth-service"
  tag: latest

containerPort: 8091

service:
  port: 8091

env:
  DB_URL: jdbc:mysql://<RDS_ENDPOINT>:3306/pg_auth_db

secretEnv:
  DB_USERNAME: "<DB_USERNAME>"
  DB_PASSWORD: "<DB_PASSWORD>"

nodeSelector:
  role: pg
