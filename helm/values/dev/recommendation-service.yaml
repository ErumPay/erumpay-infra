nameOverride: recommendation-service
fullnameOverride: recommendation-service
replicaCount: 2

image:
  repository: "512138915880.dkr.ecr.ap-northeast-2.amazonaws.com/erumpay/recommendation-service"
  tag: latest

containerPort: 8084

service:
  port: 8084

env:
  ZIPKIN_ENDPOINT: "http://erumpay-zipkin.platform-operations.svc.cluster.local:9411/api/v2/spans"
  TRACING_SAMPLING_PROBABILITY: "1.0"
  DB_URL: "jdbc:mysql://erumpay-mysql.c1i4w0cia7ah.ap-northeast-2.rds.amazonaws.com:3306/recommend_db"
  KAFKA_BOOTSTRAP_SERVERS: "erumpay-kafka.middleware.svc.cluster.local:9092"
  SCHEMA_REGISTRY_URL: "http://erumpay-schema-registry.middleware.svc.cluster.local:18081"
  RECOMMENDATION_AI_SELECTOR_ENABLED: true
  RECOMMENDATION_AI_TIMEOUT_MS: 15000
  RECOMMENDATION_AI_MAX_CONTEXT_ITEMS: 20
  RECOMMENDATION_AI_DEBUG_REASON_LOG_ENABLED: false
  RECOMMENDATION_AI_CONTEXT_LOG_ENABLED: false
  RECOMMENDATION_AI_DATA_TIER: PAID
  RECOMMENDATION_AI_FREE_TIER_DUMMY_DATA_CONFIRMED: true

  RECOMMENDATION_AI_PROVIDER: openai
  RECOMMENDATION_AI_MODEL: gpt-4o-mini

existingSecret: recommendation-service-secret
secretEnv: {}

nodeSelector:
  role: pay
