apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litmus-dev
  namespace: platform-operations
spec:
  project: default
  source:
    repoURL: https://litmuschaos.github.io/litmus-helm
    chart: litmus
    targetRevision: 3.26.0
    helm:
      releaseName: litmus
      values: |
        mongodb:
          replicaCount: 1
          persistence:
            enabled: true
            storageClass: "ebs-retain"
            accessMode: ReadWriteOnce
            size: 20Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-operations
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
