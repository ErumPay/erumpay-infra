apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pg-auth-service-dev
  namespace: platform-operations
spec:
  project: default
  source:
    repoURL: https://github.com/ErumPay/erumpay-infra.git
    targetRevision: develop
    path: helm/charts/erumpay-service
    helm:
      releaseName: pg-auth-service
      valueFiles:
        - ../../values/dev/pg-auth-service.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: pg
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
